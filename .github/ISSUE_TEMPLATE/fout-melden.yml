name: Fout melden
description: Iets werkt niet zoals verwacht in VLEA - kaarten voor AutoCAD.
title: "Fout: "
labels: ["fout"]
body:
  - type: markdown
    attributes:
      value: |
        **Voeg geen tekeningen, projectgegevens, klantnamen of projectadressen toe.** Dit issue is openbaar.
        Het logboek staat in `%LOCALAPPDATA%\VLEA-AutoCAD\logs\` (één bestand per dag). Lees het eerst
        door en haal bestandsnamen en coördinaten weg die iets over een project zeggen, voordat je het plakt.

        Laden mislukt of duurt lang? De plugin praat alleen met PDOK (api.pdok.nl, service.pdok.nl),
        de BRO voor de sonderingen, boringen en peilbuizen (publiek.broservices.nl), de legger van Rijkswaterstaat voor de zones
        (geo.rijkswaterstaat.nl), Digitaal Vlaanderen voor de kaarten van Vlaanderen en VKAHNPUNT in een tekening
        in Lambert (geo.api.vlaanderen.be), DOV voor de sonderingen van Vlaanderen (www.dov.vlaanderen.be), AWV
        voor de hectometerpaaltjes van Vlaanderen (opendata.apps.mow.vlaanderen.be), bij AHN5 en AHN6 de dienst die het AHN
        daarvoor aanwijst (api.ellipsis-drive.com), voor de riolering in en bij Eindhoven en Papendrecht de kaartdienst van
        de gemeente (gisservice.eindhoven.nl en services8.arcgis.com), voor de zones van De Stichtse Rijnlanden, Zuiderzeeland,
        Scheldestromen, Hunze en Aa's, Vechtstromen en Wetterskip Fryslân de kaartdienst van het waterschap
        (services1.arcgis.com, services.arcgis.com, geo.scheldestromen.nl en opendata.hunzeenaas.nl) en GitHub (api.github.com,
        de versiecheck; versies tot en met 1.2.0 bij VKUPDATE ook github.com en release-assets.githubusercontent.com). Laat een proxy of firewall die door, of noem hieronder
        welke niet bereikbaar is.
  - type: input
    id: autocad
    attributes:
      label: AutoCAD-product en -versie
      placeholder: "bijv. Civil 3D 2025, AutoCAD 2026"
    validations:
      required: true
  - type: input
    id: versie
    attributes:
      label: Versie van VLEA
      description: Onderaan het palet, of typ VKHELP of VKOVER.
      placeholder: "bijv. 1.5.0"
    validations:
      required: true
  - type: textarea
    id: stappen
    attributes:
      label: Wat deed je?
      description: Stappen om de fout te herhalen. Gebruik een openbare plek (bijv. een adres in het centrum van Amersfoort, of in Vlaanderen het centrum van Leuven) als het kan.
    validations:
      required: true
  - type: textarea
    id: verwacht
    attributes:
      label: Wat verwachtte je, en wat gebeurde er?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Foutmelding of stuk uit het log (optioneel, eerst nalezen)
      render: text
