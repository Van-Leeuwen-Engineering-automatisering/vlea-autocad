# Publiceert de release van VLEA uit de bestanden in release/ als er een versietag (v*) wordt gepusht.
# Alleen op de losse tak release/vX.Y.Z; die tak gaat na het publiceren weg, de tag blijft.
name: publiceer-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publiceer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer de bestanden met SHA256SUMS.txt
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Maak de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/VLEA-AutoCAD-Setup.exe release/VLEA-AutoCAD.zip release/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "VLEA $GITHUB_REF_NAME"
          --notes-file release/RELEASE-TEKST.txt
          --latest
          --verify-tag